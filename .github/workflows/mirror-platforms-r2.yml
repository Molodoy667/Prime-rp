name: Mirror iOS and Windows resources to R2

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Source platform to mirror
        required: true
        type: choice
        options:
          - ios
          - windows
      mode:
        description: Read-only preflight, upload, or checksum verification
        required: true
        type: choice
        options:
          - preflight
          - upload
          - verify
      confirm_upload:
        description: For upload only, type MIRROR-PLATFORMS-288
        required: false
        type: string
      overwrite_existing:
        description: Overwrite existing R2 objects
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'Molodoy667/Prime-rp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: hassle-r2-mirror
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve destination
        id: destination
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            ios)
              echo "bucket=united-ukraine-ios" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo "bucket=united-ukraine-windows" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Require explicit upload phrase
        if: inputs.mode == 'upload'
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          if [[ "$CONFIRM_UPLOAD" != "MIRROR-PLATFORMS-288" ]]; then
            echo "For a full upload, set confirm_upload to MIRROR-PLATFORMS-288."
            exit 1
          fi

      - name: Check R2 credentials
        if: inputs.mode != 'preflight'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [[ -n "$R2_ACCOUNT_ID" ]] || missing+=(R2_ACCOUNT_ID)
          [[ -n "$R2_ACCESS_KEY_ID" ]] || missing+=(R2_ACCESS_KEY_ID)
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || missing+=(R2_SECRET_ACCESS_KEY)
          if (( ${#missing[@]} )); then
            echo "Missing R2 secrets in hassle-r2-mirror: ${missing[*]}"
            exit 1
          fi

      - name: Install rclone
        if: inputs.mode != 'preflight'
        run: |
          RCLONE_VERSION=1.75.2
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/rclone.zip" \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/rclone.zip" "$RUNNER_TEMP/rclone"
          RCLONE_BINARY="$(find "$RUNNER_TEMP/rclone" -maxdepth 2 -type f -name rclone -print -quit)"
          test -n "$RCLONE_BINARY"
          sudo install -m 0755 "$RCLONE_BINARY" /usr/local/bin/rclone
          rclone version
          rclone copyurl --help | grep -F -- '--urls'

      - name: Check source manifests
        if: inputs.mode == 'preflight'
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/platform_r2_mirror.py preflight --platform "$PLATFORM"

      - name: Upload source objects to R2
        if: inputs.mode == 'upload'
        env:
          PLATFORM: ${{ inputs.platform }}
          R2_BUCKET: ${{ steps.destination.outputs.bucket }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(upload --platform "$PLATFORM" --bucket "$R2_BUCKET")
          if [[ "$OVERWRITE_EXISTING" == "true" ]]; then args+=(--overwrite); fi
          python3 scripts/platform_r2_mirror.py "${args[@]}"

      - name: Verify R2 objects
        if: inputs.mode == 'verify'
        env:
          PLATFORM: ${{ inputs.platform }}
          R2_BUCKET: ${{ steps.destination.outputs.bucket }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/platform_r2_mirror.py verify --platform "$PLATFORM" --bucket "$R2_BUCKET"
